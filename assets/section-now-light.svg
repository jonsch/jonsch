<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 60" width="600" height="60" role="img" aria-label="What I'm building">
  <style>
    .sans{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif}
    .mono{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace}
    .in{animation:in .7s cubic-bezier(.2,.8,.2,1) both}
    @keyframes in{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
    .badge{animation:badge .6s .1s cubic-bezier(.2,.8,.2,1.3) both;transform-box:fill-box;transform-origin:center}
    @keyframes badge{from{opacity:0;transform:scale(.5) rotate(-12deg)}to{opacity:1;transform:none}}
    .line{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.1s .35s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .glow{animation:glow 2.8s ease-in-out infinite}
    @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
    .dot{animation:dot 2.6s linear infinite}
    @keyframes dot{to{transform:translateX(540px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.line{stroke-dashoffset:0}}
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ca1c21"/><stop offset="1" stop-color="#fccd26"/></linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0"><stop offset="0" stop-color="#ca1c21"/><stop offset=".6" stop-color="#fccd26"/><stop offset="1" stop-color="#fccd26" stop-opacity="0"/></linearGradient>
  </defs>
  <g class="badge">
    <rect x="2" y="8" width="40" height="40" rx="11" fill="url(#g)"/>
    <rect class="glow" x="2" y="8" width="40" height="40" rx="11" fill="none" stroke="#fff" stroke-opacity=".5"/>
    <text class="mono" x="22" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">03</text>
  </g>
  <g class="in">
    <text class="sans" x="56" y="36" font-size="27" font-weight="700" fill="#1f2328">What I'm building</text>
  </g>
  <path class="line" d="M2 56 H 598" stroke="url(#fade)" stroke-width="2" stroke-linecap="round"/>
  <circle class="dot" cx="30" cy="56" r="3" fill="#fccd26" opacity=".9"/>
</svg>
