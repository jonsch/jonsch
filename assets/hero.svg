<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Hi, I'm Jonathan Schroeder">
  <style>
    .sans{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif}
    .mono{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace}
    .enter{animation:enter .9s cubic-bezier(.2,.8,.2,1) both}
    @keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .hi{fill:#67e8f9;font-size:17px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:0;animation:fade .7s .15s ease-out forwards}
    @keyframes fade{to{opacity:1}}
    .name{font-size:54px;font-weight:700;fill:url(#nameGrad);letter-spacing:-.01em}
    .l{fill-opacity:0;animation:lin .55s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes lin{from{fill-opacity:0}to{fill-opacity:1}}
    .prompt{fill:#a78bfa;font-size:21px;font-weight:700}
    .type{fill:#e2e8f0;font-size:21px}
    .cursor{fill:#67e8f9;animation:blink 1.1s steps(2,start) infinite}
    @keyframes blink{to{opacity:0}}
    .p{fill:#fff;opacity:0;animation:rise linear infinite}
    @keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.5}90%{opacity:.35}100%{transform:translateY(-340px);opacity:0}}
    .ring{fill:none;stroke:#8b5cf6;stroke-opacity:.45;stroke-width:1.2;stroke-dasharray:4 6}
    .spin{transform-origin:772px 150px;animation:spin linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .rev{animation-direction:reverse}
    .core{animation:pulse 3s ease-in-out infinite;transform-origin:772px 150px}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
    .bar{animation:slide 3s linear infinite}
    @keyframes slide{to{transform:translateX(900px)}}
    .card{animation:card 1s cubic-bezier(.2,.8,.2,1) both}
    @keyframes card{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
    .blob{filter:url(#blur)}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.l{fill-opacity:1}.hi{opacity:1}}
  </style>
  <defs>
    <clipPath id="card"><rect width="900" height="300" rx="22"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#67e8f9"/>
      <animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" x2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></linearGradient>
    <radialGradient id="coreGrad"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
  </defs>

  <g class="card" style="transform-origin:center" clip-path="url(#card)">
    <rect width="900" height="300" fill="url(#bg)"/>
    <g class="blob" opacity=".6">
      <circle r="150" fill="#7c3aed"><animate attributeName="cx" values="120;260;80;120" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="60;200;140;60" dur="16s" repeatCount="indefinite"/></circle>
      <circle r="130" fill="#06b6d4"><animate attributeName="cx" values="560;420;640;560" dur="19s" repeatCount="indefinite"/><animate attributeName="cy" values="300;120;260;300" dur="19s" repeatCount="indefinite"/></circle>
      <circle r="120" fill="#ec4899"><animate attributeName="cx" values="860;720;880;860" dur="21s" repeatCount="indefinite"/><animate attributeName="cy" values="40;160;240;40" dur="21s" repeatCount="indefinite"/></circle>
    </g>
    <rect width="900" height="300" fill="url(#grid)"/>
    <circle class="p" cx="40" cy="310" r="1.2" style="animation-duration:7s;animation-delay:0s"/>
    <circle class="p" cx="213" cy="310" r="2" style="animation-duration:8.7s;animation-delay:-1.37s"/>
    <circle class="p" cx="386" cy="310" r="2.8" style="animation-duration:10.4s;animation-delay:-2.74s"/>
    <circle class="p" cx="559" cy="310" r="1.2" style="animation-duration:12.1s;animation-delay:-4.11s"/>
    <circle class="p" cx="732" cy="310" r="2" style="animation-duration:13.8s;animation-delay:-5.48s"/>
    <circle class="p" cx="85" cy="310" r="2.8" style="animation-duration:7s;animation-delay:-6.85s"/>
    <circle class="p" cx="258" cy="310" r="1.2" style="animation-duration:8.7s;animation-delay:-8.22s"/>
    <circle class="p" cx="431" cy="310" r="2" style="animation-duration:10.4s;animation-delay:-9.59s"/>
    <circle class="p" cx="604" cy="310" r="2.8" style="animation-duration:12.1s;animation-delay:-10.96s"/>
    <circle class="p" cx="777" cy="310" r="1.2" style="animation-duration:13.8s;animation-delay:-12.33s"/>
    <circle class="p" cx="130" cy="310" r="2" style="animation-duration:7s;animation-delay:-6.7s"/>
    <circle class="p" cx="303" cy="310" r="2.8" style="animation-duration:8.7s;animation-delay:-6.37s"/>
    <circle class="p" cx="476" cy="310" r="1.2" style="animation-duration:10.4s;animation-delay:-6.04s"/>
    <circle class="p" cx="649" cy="310" r="2" style="animation-duration:12.1s;animation-delay:-5.71s"/>
    <rect width="900" height="300" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".12"/>

    <!-- orbit decoration -->
    <g>
      <circle class="ring" cx="772" cy="150" r="42"/>
      <circle class="ring" cx="772" cy="150" r="68" stroke="#22d3ee"/>
      <circle class="ring" cx="772" cy="150" r="94" stroke="#ec4899"/>
      <g class="spin" style="animation-duration:9s"><circle cx="814" cy="150" r="4" fill="#c4b5fd"/></g>
      <g class="spin rev" style="animation-duration:14s"><circle cx="840" cy="150" r="4.5" fill="#67e8f9"/></g>
      <g class="spin" style="animation-duration:22s"><circle cx="866" cy="150" r="3.5" fill="#f9a8d4"/></g>
      <circle class="core" cx="772" cy="150" r="22" fill="url(#coreGrad)"/>
    </g>

    <g class="enter">
      <text class="sans hi" x="56" y="96">Hi, I'm</text>
      <text class="sans name" x="54" y="152"><tspan class="l" style="animation-delay:0.35s">J</tspan><tspan class="l" style="animation-delay:0.395s">o</tspan><tspan class="l" style="animation-delay:0.44s">n</tspan><tspan class="l" style="animation-delay:0.485s">a</tspan><tspan class="l" style="animation-delay:0.53s">t</tspan><tspan class="l" style="animation-delay:0.575s">h</tspan><tspan class="l" style="animation-delay:0.62s">a</tspan><tspan class="l" style="animation-delay:0.665s">n</tspan><tspan class="l" style="animation-delay:0.71s"> </tspan><tspan class="l" style="animation-delay:0.755s">S</tspan><tspan class="l" style="animation-delay:0.8s">c</tspan><tspan class="l" style="animation-delay:0.845s">h</tspan><tspan class="l" style="animation-delay:0.89s">r</tspan><tspan class="l" style="animation-delay:0.935s">o</tspan><tspan class="l" style="animation-delay:0.98s">e</tspan><tspan class="l" style="animation-delay:1.025s">d</tspan><tspan class="l" style="animation-delay:1.07s">e</tspan><tspan class="l" style="animation-delay:1.115s">r</tspan></text>
      <text class="mono prompt" x="56" y="212">❯</text>
      
